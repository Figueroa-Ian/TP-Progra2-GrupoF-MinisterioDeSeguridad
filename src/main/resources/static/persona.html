<!DOCTYPE html>
<html>
    <head>
        <title>FORMULARIO PERSONA</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <h2>Formulario para crear Personas</h2>

            <form action="http://localhost:8080/personas/crear" method="POST">
                <div>
                    <label for="dni">DNI:</label><br>
                    <input type="text" id="dni" name="dni" placeholder="Ej: 40111222" required>
                </div>
                <br>
                <div>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
                </div>
                <br>
                <div>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez" required>
                </div>
                <br>
                <div>
                    <label for="direccion">Dirección:</label><br>
                    <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. Corrientes 123">
                </div>
                <br>
                <div>
                    <label for="rol">Rol:</label><br>
                    <select id="rol" name="rol" required>
                        <option value="" disabled selected>-- Seleccione un rol --</option>
                        <option value="VIGILANTE">VIGILANTE</option>
                        <option value="DELINCUENTE">DELINCUENTE</option>
                        <option value="JUEZ">JUEZ</option>
                    </select>
                </div>
                <br>
                <button type="submit">Guardar Persona</button>
            </form>
        </div>
    </body>
</html>
