<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Banda - Ministerio de Seguridad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Registrar Nueva Banda</h2>
                
                <form id="bandaForm">
                    <div class="mb-3">
                        <label for="nombreBanda" class="form-label">Nombre de la Banda:</label>
                        <input type="text" class="form-control" id="nombreBanda" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Guardar Banda</button>
                </form>

                <div id="mensaje" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('bandaForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Solo enviamos el nombre; Java y la BD se encargan del ID y del 0 en miembros
            const bandaData = {
                nombreBanda: document.getElementById('nombreBanda').value
            };

            try {
                const response = await fetch('http://localhost:8080/crear/banda', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bandaData)
                });

                if (response.ok) {
                    document.getElementById('mensaje').innerHTML = `
                        <div class="alert alert-success" role="alert">
                            ¡Banda registrada con éxito!
                        </div>`;
                    document.getElementById('bandaForm').reset();
                } else {
                    document.getElementById('mensaje').innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            Error al registrar la banda.
                        </div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('mensaje').innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        No se pudo conectar con el servidor.
                    </div>`;
            }
        });
    </script>
</body>
</html>
